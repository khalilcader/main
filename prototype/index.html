<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work Strip</title>
<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
/* Layout: one full-bleed stage. Covers live on springs and move between a
   bottom-aligned row, a packed grid, and a centered "open" view. */
:root {
  --bg: #f5f5f2;
  --ink: #161615;
  --muted: #73736d;
  --line: #e3e3de;
  --panel: rgba(255, 255, 255, 0.92);
  --scrim: rgba(36, 36, 33, 0.42);
  --shadow: rgba(22, 22, 20, 0.14);
  --focus: #2f5bd8;
  --veil: rgba(26, 26, 24, 0.42);
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");

  --f-ui: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --ink: #ecece8; --muted: #8d8d86; --line: #2a2a27;
    --panel: rgba(28, 28, 26, 0.92); --scrim: rgba(0, 0, 0, 0.62);
    --shadow: rgba(0, 0, 0, 0.55); --focus: #8fa9ff; --veil: rgba(0, 0, 0, 0.58); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --ink: #ecece8; --muted: #8d8d86; --line: #2a2a27;
  --panel: rgba(28, 28, 26, 0.92); --scrim: rgba(0, 0, 0, 0.62);
  --shadow: rgba(0, 0, 0, 0.55); --focus: #8fa9ff; --veil: rgba(0, 0, 0, 0.58); color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#stage {
  position: fixed; inset: 0; overflow: hidden;
  touch-action: none; user-select: none; -webkit-user-select: none;
  cursor: grab;
}
#stage.dragging { cursor: grabbing; }

#backdrop {
  position: absolute; inset: 0; z-index: 10; pointer-events: none;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  opacity: 0;
}
/* Progressive edge blur. Eight stacked backdrop blurs, strength rising along an
   eased curve (set in script), each masked to its own overlapping band (transparent, opaque, opaque,
   transparent). Together they ramp from sharp on the inside to heavy blur at the
   viewport edge with no visible steps. Grain lives in a separate element on top:
   a blend mode inside .edge would isolate it and leave the blurs nothing to blur. */
.edge {
  position: fixed; top: 0; bottom: 0; z-index: 25; pointer-events: none;
  width: var(--edge-w, 18vw);
}
.edge, .edge-grain { will-change: transform; }
.edge.l { left: 0; }
.edge.r { right: 0; transform: scaleX(-1); }
.edge i { position: absolute; inset: 0; }
/* Fade to the page on top of the blur, so covers blur away and dissolve together. */
.edge::after {
  content: ""; position: absolute; inset: 0;
  background: var(--fade, none);   /* eased fade to the page, built in script */
}
.edge i { display: block; -webkit-backdrop-filter: blur(var(--b)); backdrop-filter: blur(var(--b)); }
.edge i:nth-child(1) { -webkit-mask-image: linear-gradient(to left, transparent 0%, #000 12.5%, #000 25%, transparent 37.5%); mask-image: linear-gradient(to left, transparent 0%, #000 12.5%, #000 25%, transparent 37.5%); }
.edge i:nth-child(2) { -webkit-mask-image: linear-gradient(to left, transparent 12.5%, #000 25%, #000 37.5%, transparent 50%); mask-image: linear-gradient(to left, transparent 12.5%, #000 25%, #000 37.5%, transparent 50%); }
.edge i:nth-child(3) { -webkit-mask-image: linear-gradient(to left, transparent 25%, #000 37.5%, #000 50%, transparent 62.5%); mask-image: linear-gradient(to left, transparent 25%, #000 37.5%, #000 50%, transparent 62.5%); }
.edge i:nth-child(4) { -webkit-mask-image: linear-gradient(to left, transparent 37.5%, #000 50%, #000 62.5%, transparent 75%); mask-image: linear-gradient(to left, transparent 37.5%, #000 50%, #000 62.5%, transparent 75%); }
.edge i:nth-child(5) { -webkit-mask-image: linear-gradient(to left, transparent 50%, #000 62.5%, #000 75%, transparent 87.5%); mask-image: linear-gradient(to left, transparent 50%, #000 62.5%, #000 75%, transparent 87.5%); }
.edge i:nth-child(6) { -webkit-mask-image: linear-gradient(to left, transparent 62.5%, #000 75%, #000 87.5%, transparent 100%); mask-image: linear-gradient(to left, transparent 62.5%, #000 75%, #000 87.5%, transparent 100%); }
.edge i:nth-child(7) { -webkit-mask-image: linear-gradient(to left, transparent 75%, #000 87.5%, #000 100%); mask-image: linear-gradient(to left, transparent 75%, #000 87.5%, #000 100%); }
.edge i:nth-child(8) { -webkit-mask-image: linear-gradient(to left, transparent 87.5%, #000 100%); mask-image: linear-gradient(to left, transparent 87.5%, #000 100%); }
.edge-grain {
  position: fixed; top: 0; bottom: 0; z-index: 26; pointer-events: none;
  width: var(--edge-w, 18vw);
  background-image: var(--grain); background-size: 200px 200px;
  mix-blend-mode: overlay; opacity: 0.32;
  -webkit-mask-image: linear-gradient(to left, transparent 20%, #000 65%, transparent 100%); mask-image: linear-gradient(to left, transparent 20%, #000 65%, transparent 100%);
}
.edge-grain.l { left: 0; }
.edge-grain.r { right: 0; transform: scaleX(-1); }
body.no-edges .edge, body.no-edges .edge-grain { display: none; }

/* Film grain over anything pushed out of focus. */
#backdrop::after, .veil::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background-image: var(--grain); background-size: 200px 200px;
  mix-blend-mode: overlay; opacity: 0.55;
}
.veil {
  position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: var(--veil); opacity: 0;
}

.card {
  position: absolute; left: 0; top: 0; padding: 0; margin: 0;
  border: 0; border-radius: 12px; background: none; color: inherit;
  transform-origin: 0 0; will-change: transform, filter;
  box-shadow: 0 1px 2px var(--shadow), 0 8px 24px -12px var(--shadow);
  cursor: inherit; font: inherit; text-align: left;
}
.card:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }

.cover {
  position: absolute; inset: 0; overflow: hidden; border-radius: inherit;
  background: var(--c-bg);
  pointer-events: none;
}
/* Chrome */
.bar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 30;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) clamp(16px, 4vw, 48px) 0;
  pointer-events: none;
}
.bar > * { pointer-events: auto; }
.who { display: grid; gap: 2px; }
.who b { font: 600 15px/1.2 var(--f-ui); letter-spacing: -0.01em; }
.who span { font: 400 11px/1.2 var(--f-mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.tools { display: flex; gap: 8px; }
.tool {
  height: 32px; min-width: 32px; padding: 0 12px; border-radius: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: 500 12px/1 var(--f-ui); cursor: pointer;
  box-shadow: 0 1px 2px var(--shadow);
}
.tool.icon { padding: 0; width: 32px; }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tool:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.tool svg { width: 16px; height: 16px; }

.hint {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  max-width: calc(100% - 32px); text-align: center;
  font: 400 11px/1.4 var(--f-mono); color: var(--muted); letter-spacing: 0.03em;
  pointer-events: none;
}

/* Values panel */
#values {
  position: fixed; z-index: 40; right: clamp(16px, 4vw, 48px);
  top: calc(env(safe-area-inset-top, 0px) + 62px);
  width: min(300px, calc(100% - 32px)); max-height: calc(100% - 120px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  box-shadow: 0 12px 40px -16px var(--shadow);
  padding: 12px 14px 14px; font: 400 11px/1.3 var(--f-mono);
  touch-action: auto;
}
#values h2 { margin: 0 0 8px; font: 500 12px/1 var(--f-ui); text-align: center; }
#values h3 { margin: 12px 0 4px; font: 500 10px/1 var(--f-mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
#values dl { margin: 0; display: grid; grid-template-columns: 1fr auto; }
#values dt, #values dd { margin: 0; padding: 5px 0; border-bottom: 1px solid var(--line); }
#values dt { color: var(--muted); }
#values dd { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctl { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.ctl label { color: var(--muted); }
.ctl output { font-variant-numeric: tabular-nums; }
.ctl input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); }
.ctl.check { grid-template-columns: auto 1fr; }
.ctl.check input { accent-color: var(--ink); margin: 0; }
</style>

</head>
<body>
<div id="stage" aria-label="Selected work">
  <div id="backdrop"></div>
</div>

<div class="edge l" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="edge r" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="edge-grain l" aria-hidden="true"></div>
<div class="edge-grain r" aria-hidden="true"></div>

<header class="bar">
  <div class="who"><b>Khalil Cader</b><span>Selected work · placeholder covers</span></div>
  <div class="tools">
    <button class="tool icon" id="gridBtn" type="button" aria-pressed="false" aria-label="Show as grid" title="Grid (G)">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg>
    </button>
    <button class="tool" id="valuesBtn" type="button" aria-pressed="false" aria-controls="values">Values</button>
  </div>
</header>

<aside id="values" hidden aria-label="Spring values">
  <h2>Values</h2>
  <dl id="readout"></dl>
  <h3>Tuning</h3>
  <div class="ctl"><label for="kIn">stiffness</label><output id="kOut"></output><input id="kIn" type="range" min="60" max="700" step="10"></div>
  <div class="ctl"><label for="cIn">damping</label><output id="cOut"></output><input id="cIn" type="range" min="4" max="70" step="1"></div>
  <div class="ctl"><label for="rIn">rubber band</label><output id="rOut"></output><input id="rIn" type="range" min="0.15" max="1" step="0.05"></div>
  <div class="ctl"><label for="dIn">deceleration</label><output id="dOut"></output><input id="dIn" type="range" min="0.8" max="10" step="0.1"></div>
  <div class="ctl"><label for="bIn">brake</label><output id="bOut"></output><input id="bIn" type="range" min="0" max="4000" step="100"></div>
  <div class="ctl"><label for="rdIn">ripple delay</label><output id="rdOut"></output><input id="rdIn" type="range" min="0" max="140" step="5"></div>
  <div class="ctl"><label for="rfIn">ripple falloff</label><output id="rfOut"></output><input id="rfIn" type="range" min="0.4" max="1" step="0.02"></div>
  <div class="ctl check"><input id="edgeIn" type="checkbox" checked><label for="edgeIn">edge blur</label></div>
  <div class="ctl"><label for="ewIn">edge width</label><output id="ewOut"></output><input id="ewIn" type="range" min="6" max="35" step="1"></div>
  <div class="ctl"><label for="ebIn">edge max blur</label><output id="ebOut"></output><input id="ebIn" type="range" min="0" max="40" step="1"></div>
  <div class="ctl"><label for="ecIn">blur easing</label><output id="ecOut"></output><input id="ecIn" type="range" min="1" max="5" step="0.1"></div>
  <div class="ctl"><label for="efIn">edge fade</label><output id="efOut"></output><input id="efIn" type="range" min="0" max="1" step="0.05"></div>
  <div class="ctl check"><input id="snapIn" type="checkbox"><label for="snapIn">snap row to covers</label></div>
  <div class="ctl check"><input id="slowIn" type="checkbox"><label for="slowIn">slow motion (¼ speed)</label></div>
</aside>

<p class="hint" id="hint">Drag or scroll the row · tap or pull a cover up to open · pull down to squish · G for grid</p>

<script>
(() => {
  // Placeholder covers: Apple system colors with varied aspect ratios (w/h).
  // Swap for real work later: title, kind, year, aspect, image.
  const DATA = [
    { t: "Red", bg: "#FF3B30", a: 0.8 },
    { t: "Orange", bg: "#FF9500", a: 0.7 },
    { t: "Yellow", bg: "#FFCC00", a: 1.35 },
    { t: "Green", bg: "#34C759", a: 0.78 },
    { t: "Mint", bg: "#00C7BE", a: 0.92 },
    { t: "Teal", bg: "#30B0C7", a: 1 },
    { t: "Cyan", bg: "#32ADE6", a: 0.68 },
    { t: "Blue", bg: "#007AFF", a: 1.45 },
    { t: "Indigo", bg: "#5856D6", a: 0.8 },
    { t: "Purple", bg: "#AF52DE", a: 0.9 },
    { t: "Pink", bg: "#FF2D55", a: 1.1 },
    { t: "Brown", bg: "#A2845E", a: 0.75 },
  ];

  const $ = (s) => document.querySelector(s);
  const stage = $("#stage"), backdrop = $("#backdrop");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Tunable from the Values panel.
  const P = { k: reduce ? 700 : 240, c: reduce ? 53 : 30, rubber: 0.55, decay: 4.5, brake: 1400, snapRow: false, time: 1, rippleDelay: reduce ? 0 : 30, falloff: 0.85,
    edgeW: 20, edgeBlur: 14, edgeCurve: 2.6, edgeFade: 0.9 };
  const EDGE_K = 170, EDGE_C = 26;     // overscroll spring-back (critically damped)
  const SNAP_K = 220, SNAP_C = 29;     // settling onto a snap point (just under critical)
  const SQ_K = 900, SQ_C = 60;         // grabbed cover returning from a squish (no bounce)
  const NB_K = 700, NB_C = 53;         // neighbors catching up to the ripple
  const PULL = 300;                    // px of vertical drag for a full row <-> large scrub
  const SQUISH_D = 160, MAX_SQ = 0.6;  // squish resistance: 432px of pull lands near 0.56 scale
  const COMMIT_D = 0.3, COMMIT_V = 100; // commit thresholds: 90px of drag, or 0.10 px/ms
  const squishOf = (d) => 1 - 1 / (1 + d / SQUISH_D);
  const OV_K = 320, OV_C = 36;         // per-cover overscroll lag (critically damped: gaps stretch, then relax)
  const FLING_D = 230;                 // focused cover: drag this far (or flick) in any direction to dismiss
  const soft = (x, d) => (1 - 1 / (x / d + 1)) * d;  // starts 1:1, resists more the further you go

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  class Spring {
    constructor(v) { this.v = v; this.t = v; this.vel = 0; }
    step(dt, k, c) { const f = -k * (this.v - this.t) - c * this.vel; this.vel += f * dt; this.v += this.vel * dt; }
    snap(v) { this.v = this.t = v; this.vel = 0; }
    near(e = 0.5) { return Math.abs(this.v - this.t) < e && Math.abs(this.vel) < e * 10; }
  }

  // Rubber banding: displacement past an edge grows ever more slowly.
  const rubber = (x, d) => (1 - 1 / ((x * P.rubber) / d + 1)) * d;
  const unrubber = (r, d) => (r * d) / ((d - r) * P.rubber);
  const rubberClamp = (raw, s, d) => raw < s.min ? s.min - rubber(s.min - raw, d) : raw > s.max ? s.max + rubber(raw - s.max, d) : raw;
  const unrubberClamp = (pos, s, d) => pos < s.min ? s.min - unrubber(s.min - pos, d) : pos > s.max ? s.max + unrubber(pos - s.max, d) : pos;

  // ---- cards ----
  const cards = DATA.map((d, i) => {
    const el = document.createElement("button");
    el.type = "button"; el.className = "card"; el.dataset.i = i;
    el.setAttribute("aria-label", `${d.t} placeholder`);
    el.innerHTML = `<div class="cover" style="--c-bg:${d.bg}"></div><div class="veil"></div>`;
    stage.appendChild(el);
    return {
      d, i, el, veil: el.lastChild, W: 1, last: {},
      x: new Spring(0), y: new Spring(0), w: new Spring(10), h: new Spring(10),
      sq: new Spring(0),
      ox: new Spring(0), oy: new Spring(0), os: new Spring(1),   // free-drag offset from layout
      ovR: new Spring(0), ovB: new Spring(0),                    // overscroll stretch, row + large strip
      row: null, big: null, grid: null,
      follow: false, held: false, delay: 0, hold: null,
    };
  });
  const N = cards.length;

  // ---- state ----
  let mode = "row";                 // "row" (small strip + large strip) or "grid"
  const p = new Spring(0);          // row -> large progress
  const gp = new Spring(0);         // grid lightbox progress
  let anchor = 0, gridOpen = -1, gridActive = -1, pull = 0;
  const mk = () => ({ pos: 0, vel: 0, min: 0, max: 0, wheel: false, to: null, raw: 0, wt: 0, from: null });
  const S = { row: mk(), big: mk(), grid: mk() };
  let vw = 0, vh = 0, pad = 48, rowGap = 14;
  let simT = 0;
  const hist = [];  // recent [time, squish] samples of the anchor, replayed by neighbors
  const stats = { drag: 0, release: 0, tap: [0, 0] };

  const centerBig = (i) => cards[i].big.x + cards[i].big.w / 2 - vw / 2;
  const rowSnap = (i) => clamp(cards[i].row.x + cards[i].row.w / 2 - vw / 2, 0, S.row.max);
  const nearest = (fn, x) => { let b = 0, bd = Infinity; for (let i = 0; i < N; i++) { const d = Math.abs(fn(i) - x); if (d < bd) { bd = d; b = i; } } return b; };
  const snapFn = (s) => (s === S.big ? centerBig : s === S.row && P.snapRow ? rowSnap : null);
  const layer = () => (mode === "grid" ? S.grid : p.t >= 0.5 ? S.big : S.row);
  const dimOf = (s) => (s === S.grid ? vh : vw);

  function layout() {
    vw = stage.clientWidth; vh = stage.clientHeight;
    pad = vw < 640 ? 16 : 48;
    const gap = rowGap = vw < 640 ? 10 : 14;

    // Small row: equal-area covers on one baseline.
    const base = clamp(Math.min(vh * 0.28, vw * 0.42), 110, 250);
    const baseline = vh * 0.5 + base * 0.6;
    let x = pad;
    for (const c of cards) {
      let w = base * Math.sqrt(c.d.a), h = base / Math.sqrt(c.d.a);
      if (h > base * 1.2) { w *= (base * 1.2) / h; h = base * 1.2; }
      c.row = { x, y: baseline - h, w, h };
      x += w + gap;
    }
    S.row.min = 0; S.row.max = Math.max(0, x - gap + pad - vw);

    // Large strip: each cover as big as the viewport allows, centered vertically.
    // Large strip: centers are spaced so that while one cover is centered its
    // neighbors sit just past the viewport edges.
    const vPad = vw < 640 ? 84 : 112;
    const maxH = vh - 2 * vPad, maxW = Math.min(vw - 2 * pad - (vw < 640 ? 0 : vw * 0.22), 980);
    let cx = 0, prevW = 0;
    cards.forEach((c, i) => {
      let h = maxH, w = h * c.d.a;
      if (w > maxW) { w = maxW; h = w / c.d.a; }
      if (i) cx += vw / 2 + Math.max(w, prevW) / 2 + 32;
      c.big = { x: cx - w / 2, y: (vh - h) / 2, w, h };
      prevW = w;
    });
    S.big.min = centerBig(0); S.big.max = centerBig(N - 1);

    // Grid: shortest-column packing.
    const top = 84, cols = clamp(Math.round((vw - 2 * pad) / 230), 2, 6);
    const cw = (vw - 2 * pad - (cols - 1) * gap) / cols;
    const hs = new Array(cols).fill(top);
    for (const c of cards) {
      const col = hs.indexOf(Math.min(...hs));
      const h = cw / c.d.a;
      c.grid = { x: pad + col * (cw + gap), y: hs[col], w: cw, h };
      hs[col] += h + gap;
    }
    S.grid.min = 0; S.grid.max = Math.max(0, Math.max(...hs) - gap + 56 - vh);

    // Every layout keeps a cover's aspect ratio, so each card renders at its largest
    // size once and only ever scales down. Text and images stay crisp.
    for (const c of cards) {
      c.W = Math.max(c.big.w, lightboxRect(c).w);
      // Corner radius is a share of the shorter side, so it scales with the cover.
      c.el.style.width = c.W + "px"; c.el.style.height = c.W / c.d.a + "px";
      c.el.style.borderRadius = Math.min(c.W, c.W / c.d.a) * 0.055 + "px";
    }
    for (const s of Object.values(S)) { s.pos = clamp(s.pos, s.min, s.max); s.to = null; }
  }

  function lightboxRect(c) {
    const vPad = vw < 640 ? 76 : 104;
    const maxW = Math.min(vw - 2 * pad, 960), maxH = vh - 2 * vPad;
    let w = maxW, h = w / c.d.a;
    if (h > maxH) { h = maxH; w = h * c.d.a; }
    return { x: (vw - w) / 2, y: (vh - h) / 2, w, h };
  }

  // Where a card wants to be on screen right now.
  function targetRect(c) {
    if (mode === "row") {
      const a = c.row, b = c.big, t = clamp(p.v, -0.05, 1.2);
      const rx = a.x - clamp(S.row.pos, S.row.min, S.row.max) - c.ovR.v;
      const bx = b.x - clamp(S.big.pos, S.big.min, S.big.max) - c.ovB.v;
      return { x: lerp(rx, bx, t), y: lerp(a.y, b.y, t), w: lerp(a.w, b.w, t), h: lerp(a.h, b.h, t) };
    }
    if (c.i === gridOpen) return lightboxRect(c);
    const g = c.grid;
    return { x: g.x, y: g.y - S.grid.pos, w: g.w, h: g.h };
  }

  // ---- row <-> large ----
  function openRow(c) {
    if (mode !== "row") return;
    anchor = c.i;
    if (p.v < 0.02) { S.big.pos = centerBig(c.i); S.big.vel = 0; S.big.to = null; }
    else S.big.to = centerBig(c.i);
    S.row.vel = 0; S.row.to = null;
    p.t = 1;
  }
  function closeRow() {
    const i = nearest(centerBig, S.big.to ?? S.big.pos);
    anchor = i;
    if (p.v > 0.98) { S.row.pos = rowSnap(i); S.row.vel = 0; S.row.to = null; }
    p.t = 0;
  }

  // Focused cover released after a free drag: fly home to the row, or settle back.
  function releaseFling(c, v, commit) {
    c.held = false;
    for (const [sp, vv] of [[c.ox, v.x], [c.oy, v.y]]) { sp.t = 0; sp.vel = vv; }
    c.os.t = 1;
    if (commit) closeRow();
  }
  // How much each cover moves with an overscroll. Covers under and behind the
  // finger move fully; covers toward the stretched end trail behind, so the gaps
  // open up like a spring and close again as it settles.
  function stretchWeight(c, lay, s) {
    const o = s.pos - clamp(s.pos, s.min, s.max);
    if (!o) return 0;
    const r = c[lay], sx = r.x + r.w / 2 - clamp(s.pos, s.min, s.max);
    const ref = ptr && ptr.kind === "scroll" && ptr.s === s ? ptr.lastX : vw / 2;
    const d = Math.max(0, o < 0 ? ref - sx : sx - ref);
    return o * (0.25 + 0.75 * Math.exp(-d / (vw * 0.3)));
  }
  // Safety net for the stretch: covers may spread apart but never close a gap
  // past half its width.
  function keepGaps() {
    if (mode !== "row") return;
    const minGap = rowGap * 0.5 * (1 - clamp(p.v, 0, 1));
    for (let i = 1; i < N; i++) {
      const a = cards[i - 1], b = cards[i];
      const over = a.x.v + a.w.v + minGap - b.x.v;
      if (over > 0 && p.v < 0.02) b.x.v += over;
    }
  }

  // ---- grid lightbox ----
  function openGrid(c) {
    gridOpen = gridActive = c.i; c.follow = false; gp.t = 1;
    S.grid.vel = 0; S.grid.to = null;
  }
  function closeGrid(vel) {
    if (gridOpen < 0) return;
    const c = cards[gridOpen];
    gridOpen = -1; c.follow = false; gp.t = 0;
    if (vel) { c.x.vel = vel.x; c.y.vel = vel.y; }
  }

  function setMode(m) {
    if (m === mode) return;
    closeGrid();
    const now = performance.now();
    const order = [...cards].sort((a, b) => a.x.v - b.x.v);
    order.forEach((c, k) => {
      c.follow = false;
      c.hold = { x: c.x.v, y: c.y.v, w: c.w.v, h: c.h.v };
      c.delay = now + (reduce ? 0 : k * 16);
    });
    if (p.t >= 0.5) { S.row.pos = rowSnap(nearest(centerBig, S.big.pos)); }
    p.snap(0);
    mode = m;
    $("#gridBtn").setAttribute("aria-pressed", String(m === "grid"));
    $("#gridBtn").setAttribute("aria-label", m === "grid" ? "Show as row" : "Show as grid");
  }

  function tap(c) {
    if (mode === "grid") { if (gridOpen >= 0) closeGrid(); else if (c) openGrid(c); return; }
    if (p.t >= 0.5) {
      const cur = nearest(centerBig, S.big.to ?? S.big.pos);
      if (c && c.i !== cur) { S.big.to = centerBig(c.i); anchor = c.i; }
      else closeRow();
    } else if (c) openRow(c);
  }

  // Pull-down squish. The finger drives the anchor; each neighbor replays the
  // anchor's recent history, one ripple delay later per step out, so the shrink
  // travels down the row as a chain reaction.
  function setSquish(a) { cards[anchor].sq.snap(a); }
  function releaseSquish(vy) {
    const c = cards[anchor];
    c.sq.t = 0;
    c.sq.vel = clamp((vy * (1 - c.sq.v) ** 2) / SQUISH_D, -8, 8);
  }
  function sampleHist(t) {
    if (!hist.length || t <= hist[0][0]) return hist.length ? hist[0][1] : 0;
    for (let i = hist.length - 1; i > 0; i--) {
      const [t1, v1] = hist[i], [t0, v0] = hist[i - 1];
      if (t >= t0) return t1 === t0 ? v1 : lerp(v0, v1, (t - t0) / (t1 - t0));
    }
    return hist[0][1];
  }
  // Keep row gaps constant while covers shrink: re-flow outward from the anchor.
  const flow = new Array(N).fill(0);
  function reflow() {
    const sc = cards.map((c) => 1 - MAX_SQ * clamp(c.sq.v, -0.1, 1));
    const k = anchor, A = cards[k].row, cx = A.x + A.w / 2;
    flow[k] = 0;
    let edge = cx + (A.w * sc[k]) / 2;
    for (let i = k + 1; i < N; i++) {
      const r = cards[i].row, w = r.w * sc[i];
      flow[i] = edge + rowGap + w / 2 - (r.x + r.w / 2);
      edge += rowGap + w;
    }
    edge = cx - (A.w * sc[k]) / 2;
    for (let i = k - 1; i >= 0; i--) {
      const r = cards[i].row, w = r.w * sc[i];
      flow[i] = edge - rowGap - w / 2 - (r.x + r.w / 2);
      edge -= rowGap + w;
    }
    return sc;
  }

  // ---- pointer ----
  let ptr = null;
  // Release velocity from the last ~100ms of moves, using each event's own
  // timestamp. A pause before letting go reads as zero.
  const velocityOf = (samples, upT) => {
    const n = samples.length, last = samples[n - 1];
    if (n < 2 || upT - last[2] > 80) return { x: 0, y: 0 };
    let j = n - 2;
    while (j > 0 && last[2] - samples[j - 1][2] <= 100) j--;
    const first = samples[j], dt = (last[2] - first[2]) / 1000;
    return dt > 0.004 ? { x: (last[0] - first[0]) / dt, y: (last[1] - first[1]) / dt } : { x: 0, y: 0 };
  };

  stage.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || ptr) return;
    const el = e.target.closest(".card");
    const c = el ? cards[+el.dataset.i] : null;
    ptr = { id: e.pointerId, x0: e.clientX, y0: e.clientY, card: c, kind: null, samples: [[e.clientX, e.clientY, e.timeStamp]] };
    stage.setPointerCapture(e.pointerId);
    const s = layer();
    if (s !== S.big) { s.vel = 0; s.to = null; }  // catch a moving strip; the large strip keeps settling
  });

  stage.addEventListener("pointermove", (e) => {
    if (!ptr || e.pointerId !== ptr.id) return;
    ptr.samples.push([e.clientX, e.clientY, e.timeStamp]);
    if (ptr.samples.length > 30) ptr.samples.shift();
    ptr.lastX = e.clientX;
    let dx = e.clientX - ptr.x0, dy = e.clientY - ptr.y0;

    if (!ptr.kind && Math.hypot(dx, dy) > 6) {
      const horiz = Math.abs(dx) > Math.abs(dy);
      if (mode === "grid") {
        if (gridOpen >= 0) {
          const c = ptr.card && ptr.card.i === gridOpen ? ptr.card : null;
          ptr.kind = c ? "card" : "none";
          if (c) {
            const r = lightboxRect(c);
            ptr.rect = r;
            ptr.fx = clamp((ptr.x0 - r.x) / r.w, 0, 1); ptr.fy = clamp((ptr.y0 - r.y) / r.h, 0, 1);
            stats.tap = [ptr.fx, ptr.fy];
            c.held = true;
          }
        } else ptr.kind = "scroll";
      } else if (p.t >= 0.5 && !horiz) {
        // Focus view: a vertical drag picks up the focused cover. It then follows the
        // finger in any direction; far enough or fast enough dismisses it to the row.
        ptr.kind = "fling"; anchor = nearest(centerBig, S.big.to ?? S.big.pos);
        S.big.to = centerBig(anchor);
        S.row.pos = rowSnap(anchor); S.row.vel = 0; S.row.to = null;
        const c = cards[anchor];
        ptr.o0 = { x: c.ox.v, y: c.oy.v };
        c.held = true;
      } else if (horiz) {
        ptr.kind = "scroll";
      } else if (p.t >= 0.5) {
        ptr.kind = "vert"; ptr.origin = "big";
        anchor = nearest(centerBig, S.big.to ?? S.big.pos);
        S.big.to = centerBig(anchor);
        if (p.v > 0.98) { S.row.pos = rowSnap(anchor); S.row.vel = 0; S.row.to = null; }
      } else if (ptr.card) {
        ptr.kind = "vert"; ptr.origin = "row";
        anchor = ptr.card.i;
        if (p.v < 0.02) { S.big.pos = centerBig(anchor); S.big.vel = 0; S.big.to = null; }
      } else ptr.kind = "none";

      if (ptr.kind === "scroll") {
        const s = layer();
        ptr.s = s; s.to = null; s.vel = 0;
        ptr.raw0 = unrubberClamp(s.pos, s, dimOf(s));
        ptr.startIdx = s === S.big ? nearest(centerBig, s.pos) : null;
        stage.classList.add("dragging");
      }
      if (ptr.kind === "vert") ptr.p0 = p.v;
      if (ptr.kind === "scroll" || ptr.kind === "vert" || ptr.kind === "fling") { ptr.x0 = e.clientX; ptr.y0 = e.clientY; dx = dy = 0; }
    }

    if (ptr.kind === "scroll") {
      const s = ptr.s;
      s.pos = rubberClamp(ptr.raw0 - (s === S.grid ? dy : dx), s, dimOf(s));
      stats.drag = Math.abs(s === S.grid ? dy : dx);
    } else if (ptr.kind === "vert") {
      // Up opens, down closes; past the closed end the cover squishes against a rubber band.
      let q = ptr.p0 - dy / PULL;
      if (q > 1) q = 1 + (rubber((q - 1) * PULL, PULL) / PULL) * 0.3;
      if (q < 0) { setSquish(squishOf(-q * PULL)); q = 0; } else setSquish(0);
      p.snap(q);
      pull = ptr.origin === "big" ? clamp(1 - q, 0, 1) : 0;
      stats.drag = Math.abs(dy);
    } else if (ptr.kind === "fling") {
      const c = cards[anchor];
      const rx = ptr.o0.x + dx, ry = ptr.o0.y + dy, dist = Math.hypot(rx, ry);
      const k = dist ? soft(dist, 1100) / dist : 1;
      c.ox.snap(rx * k); c.oy.snap(ry * k);
      c.os.snap(1 - 0.32 * (1 - 1 / (1 + dist / 320)));
      pull = clamp(dist / FLING_D, 0, 1);
      stats.drag = dist;
    } else if (ptr.kind === "card") {
      // Grid lightbox: follow the finger, shrink as you pull down.
      const c = cards[gridOpen], r = ptr.rect;
      const ey = dy >= 0 ? dy : -rubber(-dy, vh * 0.5);
      pull = clamp(ey / (vh * 0.35), 0, 1);
      const sc = 1 - 0.45 * pull;
      const w = r.w * sc, h = r.h * sc;
      c.x.snap(ptr.x0 + dx - ptr.fx * w); c.y.snap(ptr.y0 + ey - ptr.fy * h);
      c.w.snap(w); c.h.snap(h);
      gp.snap(1 - pull * 0.9);
      stats.drag = Math.hypot(dx, ey);
    }
  });

  function endPointer(e, cancelled) {
    if (!ptr || e.pointerId !== ptr.id) return;
    const v = velocityOf(ptr.samples, e.timeStamp);
    stats.release = Math.hypot(v.x, v.y) / 1000;
    stage.classList.remove("dragging");

    if (!ptr.kind && !cancelled) tap(ptr.card);
    else if (ptr.kind === "scroll") {
      const s = ptr.s;
      s.vel = -(s === S.grid ? v.y : v.x);
      s.from = ptr.startIdx;
    } else if (ptr.kind === "vert") {
      const opening = ptr.origin === "row";
      const commit = opening
        ? p.v > COMMIT_D || (v.y < -COMMIT_V && p.v > 0.02)
        : p.v < 1 - COMMIT_D || v.y > COMMIT_V;
      p.t = opening === commit ? 1 : 0;
      p.vel = clamp(-v.y / PULL, -8, 8);
      releaseSquish(v.y);
      pull = 0;
    } else if (ptr.kind === "fling") {
      const c = cards[anchor];
      const ox = c.ox.v, oy = c.oy.v, dist = Math.hypot(ox, oy) || 1;
      const outward = (v.x * ox + v.y * oy) / dist;  // release speed away from center
      releaseFling(c, v, stats.drag > FLING_D || (outward > COMMIT_V && stats.drag > 24));
      pull = 0;
    } else if (ptr.kind === "card") {
      const c = cards[gridOpen];
      c.held = false;
      if (pull > 0.28 || (v.y > 500 && pull > 0.04)) closeGrid(v);
      else { c.x.vel = v.x; c.y.vel = v.y; gp.t = 1; }
      pull = 0;
    }
    ptr = null;
  }
  stage.addEventListener("pointerup", (e) => endPointer(e, false));
  stage.addEventListener("pointercancel", (e) => endPointer(e, true));

  // Keyboard activation (pointer taps are handled above).
  stage.addEventListener("click", (e) => {
    if (e.detail !== 0) return;
    const el = e.target.closest(".card");
    if (el) tap(cards[+el.dataset.i]);
  });
  stage.addEventListener("focusin", (e) => {
    const el = e.target.closest(".card");
    if (!el) return;
    const c = cards[+el.dataset.i];
    if (mode === "row" && p.t >= 0.5) { S.big.to = centerBig(c.i); anchor = c.i; return; }
    if (mode === "grid" && gridOpen >= 0) return;
    const s = layer(), r = c[mode];
    const lo = mode === "row" ? r.x - pad : r.y - 84, hi = mode === "row" ? r.x + r.w + pad - vw : r.y + r.h + 56 - vh;
    if (s.pos > lo) s.to = clamp(lo, s.min, s.max);
    else if (s.pos < hi) s.to = clamp(hi, s.min, s.max);
  });

  // Wheel and trackpad: scroll directly, rubber-band past the ends, settle once input stops.
  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (mode === "grid" && gridOpen >= 0) { if (Math.abs(e.deltaY) > 24 && !ptr) closeGrid(); return; }
    const s = layer();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? dimOf(s) : 1;
    const d = (s !== S.grid && Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * unit;
    if (!s.wheel) s.raw = unrubberClamp(s.pos, s, dimOf(s));
    s.raw += d; s.pos = rubberClamp(s.raw, s, dimOf(s));
    s.vel = 0; s.to = null; s.from = null; s.wheel = true;
    clearTimeout(s.wt); s.wt = setTimeout(() => { s.wheel = false; }, 140);
  }, { passive: false });

  addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest("#values")) return;
    if (e.key === "Escape") { if (mode === "grid") closeGrid(); else if (p.t >= 0.5) closeRow(); return; }
    if (e.key === "g" || e.key === "G") { setMode(mode === "row" ? "grid" : "row"); return; }
    if (mode === "grid" && gridOpen >= 0) return;
    const fwd = mode === "row" ? "ArrowRight" : "ArrowDown", back = mode === "row" ? "ArrowLeft" : "ArrowUp";
    if (e.key !== fwd && e.key !== back) return;
    e.preventDefault();
    const s = layer(), dir = e.key === fwd ? 1 : -1, fn = snapFn(s);
    if (fn) { const i = clamp(nearest(fn, s.to ?? s.pos) + dir, 0, N - 1); s.to = fn(i); if (s === S.big) anchor = i; }
    else { s.vel += dir * 1400; s.to = null; }
  });

  $("#gridBtn").addEventListener("click", () => setMode(mode === "row" ? "grid" : "row"));
  const panel = $("#values"), vBtn = $("#valuesBtn");
  vBtn.addEventListener("click", () => {
    panel.hidden = !panel.hidden;
    vBtn.setAttribute("aria-pressed", String(!panel.hidden));
  });

  // Tuning controls
  const zeta = () => `${P.c.toFixed(0)}  ζ ${(P.c / (2 * Math.sqrt(P.k))).toFixed(2)}`;
  const bind = (id, key, fmt) => {
    const input = $("#" + id + "In"), out = $("#" + id + "Out");
    input.value = P[key];
    const show = () => { out.textContent = fmt(+input.value); };
    input.addEventListener("input", () => { P[key] = +input.value; show(); $("#cOut").textContent = zeta(); });
    show();
  };
  bind("k", "k", (v) => v.toFixed(0));
  bind("c", "c", zeta);
  bind("r", "rubber", (v) => v.toFixed(2));
  bind("d", "decay", (v) => `${v.toFixed(1)}/s`);
  bind("b", "brake", (v) => `${v.toFixed(0)} px/s²`);
  bind("rd", "rippleDelay", (v) => `${v.toFixed(0)}ms`);
  bind("rf", "falloff", (v) => v.toFixed(2));
  bind("ew", "edgeW", (v) => `${v.toFixed(0)}vw`);
  bind("eb", "edgeBlur", (v) => `${v.toFixed(0)}px`);
  bind("ec", "edgeCurve", (v) => v.toFixed(1));
  bind("ef", "edgeFade", (v) => v.toFixed(2));
  $("#snapIn").addEventListener("change", (e) => { P.snapRow = e.target.checked; S.row.to = null; });
  for (const id of ["ew", "eb", "ec", "ef"]) $("#" + id + "In").addEventListener("input", applyEdges);
  $("#edgeIn").addEventListener("change", (e) => { document.body.classList.toggle("no-edges", !e.target.checked); });
  $("#slowIn").addEventListener("change", (e) => { P.time = e.target.checked ? 0.25 : 1; });

  // ---- edges ----
  // Blur strength per band follows an ease-in curve, so the ramp starts almost
  // imperceptibly and only gets heavy right at the edge. The fade to the page uses
  // a smootherstep ramp sampled into many stops, which avoids the visible "knee"
  // a two-stop linear gradient has.
  const edges = [...document.querySelectorAll(".edge, .edge-grain")];
  function applyEdges() {
    const root = document.documentElement.style;
    root.setProperty("--edge-w", `clamp(64px, ${P.edgeW}vw, 480px)`);
    document.querySelectorAll(".edge").forEach((ed) =>
      [...ed.children].forEach((el, k) => el.style.setProperty("--b", (P.edgeBlur * Math.pow((k + 1) / 8, P.edgeCurve)).toFixed(2) + "px")));
    const stops = [];
    for (let j = 0; j <= 16; j++) {
      const t = j / 16, u = clamp((t - 0.15) / 0.85, 0, 1);
      const e = u * u * u * (u * (u * 6 - 15) + 10);
      stops.push(`color-mix(in srgb, var(--bg) ${(P.edgeFade * e * 100).toFixed(1)}%, transparent) ${(t * 100).toFixed(1)}%`);
    }
    root.setProperty("--fade", `linear-gradient(to left, ${stops.join(", ")})`);
  }
  let edgeShift = -1;
  function slideEdges(amount) {
    // Slide (not fade) the edges away in focus: opacity on a backdrop-filter
    // parent would isolate it and switch the blur off mid-transition.
    const a = Math.round(clamp(amount, 0, 1) * 1000) / 1000;
    if (a === edgeShift) return;
    edgeShift = a;
    for (const el of edges) el.style.transform = `${el.classList.contains("r") ? "scaleX(-1) " : ""}translateX(${(-a * 100).toFixed(2)}%)`;
  }

  // ---- simulation ----
  // Where a glide from velocity v comes to rest under dv/dt = -decay*v - brake.
  function glideDist(v) {
    const a = P.decay, b = Math.max(1, P.brake), u = Math.abs(v);
    const T = Math.log(1 + (a * u) / b) / a;
    return Math.sign(v) * (u / a - (b / a) * T);
  }
  function stepScroll(s, dt) {
    if ((ptr && ptr.kind === "scroll" && ptr.s === s) || s.wheel) return;
    const fn = snapFn(s);
    if (fn && s.to == null) {
      // Project where the glide would stop, then settle on the nearest snap point.
      let i = nearest(fn, s.pos + glideDist(s.vel));
      if (s.from != null && s === S.big) {
        // Large strip pages like a native carousel: a flick, or a drag past ~a fifth
        // of the screen, moves exactly one cover in that direction.
        const moved = s.pos - fn(s.from);
        const dir = Math.abs(s.vel) > 250 ? Math.sign(s.vel) : Math.abs(moved) > vw * 0.18 ? Math.sign(moved) : 0;
        i = clamp(s.from + dir, 0, N - 1);
      }
      s.from = null;
      const t = fn(i);
      if (Math.abs(t - s.pos) > 0.5 || Math.abs(s.vel) > 2) s.to = t;
    }
    if (s.to != null) {
      const a = -SNAP_K * (s.pos - s.to) - SNAP_C * s.vel;
      s.vel += a * dt; s.pos += s.vel * dt;
      if (Math.abs(s.pos - s.to) < 0.1 && Math.abs(s.vel) < 2) { s.pos = s.to; s.vel = 0; s.to = null; }
    } else if (s.pos < s.min || s.pos > s.max) {
      const b = s.pos < s.min ? s.min : s.max;
      const a = -EDGE_K * (s.pos - b) - EDGE_C * s.vel;
      s.vel += a * dt; s.pos += s.vel * dt;
      if (Math.abs(s.pos - b) < 0.1 && Math.abs(s.vel) < 2) { s.pos = b; s.vel = 0; }
    } else if (s.vel) {
      const sg = Math.sign(s.vel);
      s.vel -= (P.decay * s.vel + sg * P.brake) * dt;
      if (Math.sign(s.vel) !== sg || Math.abs(s.vel) < 4) s.vel = 0;
      s.pos += s.vel * dt;
    }
  }

  const readout = $("#readout");
  const fmt = (n, d = 1) => (Math.abs(n) < 1e-4 ? 0 : n).toFixed(d);
  function renderValues() {
    const c = cards[mode === "grid" && gridActive >= 0 ? gridActive : anchor];
    const s = layer();
    const over = s.pos < s.min ? s.pos - s.min : s.pos > s.max ? s.pos - s.max : 0;
    const name = s === S.big ? "large strip" : s === S.row ? "row" : "grid";
    const left = anchor > 0 ? cards[anchor - 1].sq.v : 0, right = anchor < N - 1 ? cards[anchor + 1].sq.v : 0;
    const prog = mode === "grid" ? gp : p;
    const rows = [
      ["layer", name],
      ["open progress p", fmt(prog.v, 4)],
      ["spring target", fmt(prog.t, 4)],
      ["spring velocity", `${fmt(prog.vel, 4)} p/s`],
      ["anchor", c.d.t],
      ["current x / y", `${fmt(c.x.v)} / ${fmt(c.y.v)}`],
      ["current w / h", `${fmt(c.w.v)} / ${fmt(c.h.v)}`],
      ["scroll", `${fmt(s.pos)}`],
      ["bounds", `${fmt(s.min)} / ${fmt(s.max)}`],
      ["overscroll", `${fmt(over)} px`],
      ["scroll velocity", `${fmt(s.vel)} px/s`],
      ["snap target", s.to == null ? "none" : fmt(s.to)],
      ["squish", fmt(cards[anchor].sq.v, 4)],
      ["left / right ripple", `${fmt(left, 4)} / ${fmt(right, 4)}`],
      ["drag distance", `${fmt(stats.drag)} px`],
      ["release velocity", `${fmt(stats.release, 3)} px/ms`],
      ["pull progress q", fmt(pull, 4)],
      ["vector offset x / y", `${fmt(cards[anchor].ox.v)} / ${fmt(cards[anchor].oy.v)}`],
      ["vector velocity x / y", `${fmt(cards[anchor].ox.vel)} / ${fmt(cards[anchor].oy.vel)} px/s`],
      ["ripple delay", `${P.rippleDelay}ms / step`],
      ["distance commit", `${fmt(COMMIT_D * PULL)} px · drag ${FLING_D} px`],
      ["velocity commit", `${fmt(COMMIT_V / 1000, 2)} px/ms`],
    ];
    readout.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  }

  const hint = $("#hint");
  let hintKey = "";
  function updateHint() {
    const key = mode === "grid" ? (gridOpen >= 0 ? "go" : "g") : p.t >= 0.5 ? "big" : "row";
    if (key === hintKey) return;
    hintKey = key;
    hint.textContent = {
      row: "Drag or scroll the row · tap or pull a cover up to open · pull down to squish · G for grid",
      big: "Swipe left or right to browse · drag up or down to go back",
      g: "Drag or scroll the grid · tap a cover to open · G for row",
      go: "Pull the cover down or tap to close",
    }[key];
  }

  let last = performance.now(), frame = 0;
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 1 / 15) * P.time;
    last = now;

    for (const c of cards) {
      c.ovR.t = stretchWeight(c, "row", S.row);
      c.ovB.t = stretchWeight(c, "big", S.big);
      if (c.held && c.i === gridOpen) continue;
      const r = now < c.delay ? c.hold : targetRect(c);
      c.x.t = r.x; c.y.t = r.y; c.w.t = r.w; c.h.t = r.h;
    }

    // Neighbors chase the anchor's squish from a moment ago, scaled down with distance.
    for (const c of cards) {
      const d = Math.abs(c.i - anchor);
      if (d) c.sq.t = sampleHist(simT - (d * P.rippleDelay) / 1000) * Math.pow(P.falloff, d);
    }

    const n = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / n;
    const dragging = ptr && ptr.kind === "vert";
    for (let i = 0; i < n; i++) {
      for (const c of cards) {
        if (!c.follow && !c.held) { c.x.step(h, P.k, P.c); c.y.step(h, P.k, P.c); c.w.step(h, P.k, P.c); c.h.step(h, P.k, P.c); }
        if (c.i !== anchor) c.sq.step(h, NB_K, NB_C);
        else if (!dragging) c.sq.step(h, SQ_K, SQ_C);
        if (!c.held) { c.ox.step(h, P.k, P.c); c.oy.step(h, P.k, P.c); c.os.step(h, P.k, P.c); }
        c.ovR.step(h, OV_K, OV_C); c.ovB.step(h, OV_K, OV_C);
      }
      if (!dragging) p.step(h, P.k, P.c);
      if (!(ptr && ptr.kind === "card")) gp.step(h, P.k, P.c);
      stepScroll(S.row, h); stepScroll(S.big, h); stepScroll(S.grid, h);
    }
    simT += dt;
    hist.push([simT, cards[anchor].sq.v]);
    while (hist.length > 2 && hist[1][0] < simT - 1.5) hist.shift();

    // Cards that have landed lock onto their layout; cards in flight stay on springs.
    for (const c of cards) {
      if (c.held && c.i === gridOpen) continue;
      if (c.follow) { const r = targetRect(c); c.x.snap(r.x); c.y.snap(r.y); c.w.snap(r.w); c.h.snap(r.h); }
      else if (now >= c.delay && c.x.near() && c.y.near() && c.w.near() && c.h.near()) c.follow = true;
    }
    keepGaps();
    if (gridOpen < 0 && gridActive >= 0 && gp.v < 0.002 && cards[gridActive].follow) gridActive = -1;

    const gpv = clamp(gp.v, 0, 1), pv = clamp(p.v, 0, 1);
    const sc = reflow(), fb = mode === "row" ? 1 - pv : 0;
    for (const c of cards) {
      // Squish shrinks toward the bottom center of the cover's slot.
      const w = Math.max(1, c.w.v) * sc[c.i], h = Math.max(1, c.h.v) * sc[c.i];
      let x = c.x.v + flow[c.i] * fb + (c.w.v - w) / 2, y = c.y.v + c.h.v - h;
      // Free-drag offset, scaled about the cover's center.
      const os = c.os.v, w2 = w * os, h2 = h * os;
      x += c.ox.v + (w - w2) / 2; y += c.oy.v + (h - h2) / 2;
      const st = c.el.style, L = c.last;
      st.transform = `translate3d(${x}px, ${y}px, 0) scale(${w2 / c.W})`;

      // Focus: in the large strip, covers away from center dim, blur and pick up grain.
      let dim = 0;
      if (mode === "row" && pv > 0.001 && !(ptr && ptr.kind === "fling" && c.i === anchor))
        dim = pv * clamp((Math.abs(x + w2 / 2 - vw / 2) - w2 * 0.1) / (vw * 0.25), 0, 1);
      const dk = Math.round(dim * 200) / 200;
      if (L.dim !== dk) {
        L.dim = dk;
        c.veil.style.opacity = dk;
        st.filter = dk > 0.005 ? `blur(${(dk * 18).toFixed(2)}px)` : "";
      }
      const z = mode === "grid" ? (c.i === gridActive ? 20 : 1) : c.i === anchor ? 3 : 1;
      if (L.z !== z) { L.z = z; st.zIndex = z; }
      const ti = mode === "grid" && gridOpen >= 0 && c.i !== gridOpen ? -1 : 0;
      if (L.ti !== ti) { L.ti = ti; c.el.tabIndex = ti; }
    }
    backdrop.style.opacity = mode === "grid" && gridActive >= 0 ? gpv.toFixed(3) : "0";
    slideEdges(mode === "row" ? pv : gpv);
    updateHint();
    if (!panel.hidden && (frame++ % 2 === 0)) renderValues();
    requestAnimationFrame(tick);
  }

  layout();
  applyEdges();
  S.big.pos = S.big.min;
  const t0 = performance.now();
  for (const c of cards) {
    // Entrance: covers rise into the row one after another.
    const r = c.row;
    c.x.snap(r.x); c.y.snap(r.y + 40); c.w.snap(r.w); c.h.snap(r.h);
    c.hold = { ...r, y: r.y + 40 }; c.delay = t0 + (reduce ? 0 : 120 + c.i * 35);
    c.el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: reduce ? 0 : 500, delay: reduce ? 0 : 120 + c.i * 35, fill: "both" })
      .finished.then((an) => an.cancel());
  }
  addEventListener("resize", layout);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
